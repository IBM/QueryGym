[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["query_gym", "agents", "tools", "api"]

[project]
name = "query_planning"
version = "0.0.1"
dependencies = [
  "gymnasium",
  "pre-commit",
  "GitPython",
  "sqlgym",
  "pandas",
  "tenacity",
  "langchain==0.3.27",
  "langchain-openai",
  "python-dotenv",
  "langchain_huggingface",
  "tabulate",

]


[project.optional-dependencies]
presto =  ["presto-python-client"]
debug = ["psutil"]
torch = ["transformers[torch]"]
demo = ["ipywidgets","rich","voila","jupyter"]